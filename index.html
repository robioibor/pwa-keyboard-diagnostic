<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>KBD Diag</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2a78d6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="KBD Diag">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; font-family: system-ui, sans-serif; padding: 16px 16px 90px; }
  .banner { background: #d03b3b; color: #fff; font-weight: 700; font-size: 18px;
    padding: 14px; border-radius: 10px; margin-bottom: 20px; text-align: center; }
  .field { margin-bottom: 20px; }
  label { display: block; font-weight: 600; margin-bottom: 6px; }
  input { width: 100%; font-size: 17px; padding: 13px 12px; border-radius: 9px;
    border: 1px solid #ccc; min-height: 50px; }
  .sticky-footer {
    background: #fff; border-top: 1px solid #ccc;
    padding: 10px 16px calc(10px + env(safe-area-inset-bottom)); text-align: center; }
</style>
</head>
<body>
  <div class="banner">TEST PAGE &mdash; KBD-DIAG-2026-10-26 &mdash; TEST 3<br>Not CHaRM Check-In</div>

  <div class="field">
    <label for="text-field">Plain text input (like ZIP / City)</label>
    <input type="text" id="text-field" placeholder="Tap here">
  </div>

  <div class="field">
    <label for="number-field">Number input (like payment amount)</label>
    <input type="number" id="number-field" min="0" step="0.01" placeholder="0.00">
  </div>

  <p>If you can see this banner and a working on-screen keyboard appears when
  you tap either field above, the issue does not reproduce here.</p>

  <div class="sticky-footer">Fixed bottom bar (mimics the Record Check-In button)</div>
</body>
</html>
